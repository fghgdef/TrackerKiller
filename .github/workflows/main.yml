name: Build TrackerKiller APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.xml'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
      - '.github/workflows/main.yml'

permissions:
  contents: write

concurrency:
  group: trackerkiller-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Clean project
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackerKiller-Beta-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Beta Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: TrackerKiller-1.0.0-beta
          name: TrackerKiller 1.0.0 Beta
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
